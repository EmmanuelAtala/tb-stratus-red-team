name: Stratus Red Team

on:
  workflow_dispatch:
    inputs:
      technique:
        description: 'Attack technique to run (or "all")'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - aws.defense-evasion.cloudtrail-stop
          - aws.defense-evasion.cloudtrail-delete
          - aws.credential-access.ec2-steal-instance-credentials
          - aws.credential-access.secretsmanager-retrieve-secrets
          - aws.persistence.iam-backdoor-role
          - aws.exfiltration.s3-backdoor-bucket-policy

permissions:
  id-token: write
  contents: read

jobs:
  stratus:
    runs-on: ubuntu-latest
    steps:
      - name: Debug OIDC token claims
        run: |
          curl -sSL "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | \
            jq -r '.value' | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::560120514170:role/stratus-red-team-lab
          aws-region: us-east-1

      - name: Install Stratus Red Team
        run: |
          curl -sSL -o stratus.tar.gz \
            https://github.com/DataDog/stratus-red-team/releases/latest/download/stratus-red-team_Linux_x86_64.tar.gz
          tar xzf stratus.tar.gz stratus
          sudo mv stratus /usr/local/bin/stratus
          stratus version

      - name: Warm up, detonate, and clean up
        run: |
          set -euo pipefail
          if [ "${{ inputs.technique }}" = "all" ]; then
            TECHNIQUES=$(stratus list | grep 'aws\.' | awk '{print $2}')
          else
            TECHNIQUES="${{ inputs.technique }}"
          fi
          for t in $TECHNIQUES; do
            echo "=== $t ==="
            stratus warmup "$t"
            stratus detonate "$t"
            stratus cleanup "$t"
          done
